            font-weight: bold;
            color: var(--seal-red);
        }

        .cite {
            font-size: 0.7em;
            color: #999;
            vertical-align: super;
            cursor: help;
            margin-left: 2px;
        }

        .stamp {
            border: 2px solid var(--seal-red);
            color: var(--seal-red);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Ma Shan Zheng', cursive;
            display: inline-block;
            transform: rotate(-3deg);
            font-size: 0.9em;
        }

        .case-card {
            background: white;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
        }
        .case-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--ink-secondary);
            transition: all 0.3s ease;
        }
        .case-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }
        .case-card:hover::before {
            background: var(--seal-red);
        }

        .color-block {
            width: 135px;
            height: 135px;
            border-radius: 16px;
            border: 2px solid #9c9c9c;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.12);

            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: white;
            padding: 14px 10px;
        }
        .color-block:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.18);
            z-index: 2;
        }
        .block-title-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.5rem;
            color: #2c3e50;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.2;
            margin-top: 8px;
            text-shadow: 0 0 12px rgba(255,255,255,0.8), 1px 1px 2px rgba(0,0,0,0.15);

            width: 90%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

        function createBlocksHTML(configList) {
            return configList
                .filter(b => b.text && b.link && b.link !== "#")
                .map(block => {
                    const descHTML = block.desc && block.desc.trim()
                        ? `<span class="block-desc-text">${block.desc}</span>`
                        : '';
                    return `
                        <a href="${block.link}" target="_blank" rel="noopener noreferrer" class="color-block" style="background:${block.color};" title="点击访问 ${block.text}">

                            ${descHTML}
                        </a>
                    `;
                })
                .join('');
        }

        document.querySelectorAll('[data-section]').forEach(el => {
            const key = el.getAttribute('data-section');
            el.innerHTML = createBlocksHTML(contentData[key] || []);
        });

        const navItems = document.querySelectorAll('.nav-item');
        const mainContent = document.getElementById('main-content');
        const sections = document.querySelectorAll('.panel-section');

        function showSection(targetId) {
            sections.forEach(section => {
                section.classList.toggle('active', section.id === targetId);
            });
            navItems.forEach(item => {
                item.classList.toggle('active', item.getAttribute('href') === `#${targetId}`);
            });
            mainContent.scrollTop = 0;
        }

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = item.getAttribute('href').slice(1);
                showSection(targetId);
            });
        });
